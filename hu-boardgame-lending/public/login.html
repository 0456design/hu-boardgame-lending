<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#162F63">
<title>เข้าสู่ระบบเจ้าหน้าที่ | ระบบยืม–คืนบอร์ดเกม</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;padding:24px 16px;min-height:100vh;min-height:100dvh;background:#162F63;color:#0f172a;
  font-family:'Noto Sans Thai','Sarabun','Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.login-main{margin:auto;width:100%;max-width:440px}
.login-box{background:#fff;border-radius:16px;padding:40px 36px 32px;box-shadow:0 18px 48px rgba(7,16,40,.28),0 2px 8px rgba(7,16,40,.12)}
.login-head{text-align:center;margin-bottom:28px}
.login-logo{display:block;width:104px;height:104px;margin:-6px auto 8px;object-fit:contain}
.login-head h1{margin:0;font-size:1.7rem;line-height:1.3;font-weight:700;color:#162F63}
.login-head p{margin:6px 0 0;font-size:1rem;color:#64748b}
.lf{display:flex;flex-direction:column;gap:20px}
.lf-field{display:flex;flex-direction:column;gap:8px}
.lf-field label{font-size:.95rem;font-weight:600;color:#1e293b}
.lf-field input{width:100%;height:50px;padding:0 14px;font:inherit;color:#0f172a;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;outline:2px solid transparent;transition:border-color .15s,box-shadow .15s}
.lf-field input:hover{border-color:#94a3b8}
.lf-field input:focus{border-color:#2563EB;box-shadow:0 0 0 4px rgba(37,99,235,.18)}
.lf-err{margin:-4px 0 0;padding:10px 14px;border-radius:8px;background:#fef2f2;color:#b91c1c;font-size:.92rem;font-weight:500}
.lf-err:empty{display:none}
.lf-btn{width:100%;height:54px;margin-top:4px;font:inherit;font-size:1.05rem;font-weight:700;color:#fff;background:#2563EB;border:0;border-radius:8px;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
.lf-btn:hover{background:#1d4ed8;box-shadow:0 8px 20px rgba(37,99,235,.35);transform:translateY(-1px)}
.lf-btn:active{transform:translateY(0);box-shadow:none}
.lf-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.lf-btn:disabled{opacity:.7;cursor:default;transform:none;box-shadow:none}
.login-back{display:block;margin-top:24px;text-align:center;font-weight:500;color:#2563EB;text-decoration:none}
.login-back:hover{color:#1d4ed8;text-decoration:underline}
.login-back:focus-visible{outline:3px solid #93c5fd;outline-offset:3px;border-radius:4px}
@media (max-width:480px){
  body{padding:16px 12px}
  .login-box{padding:32px 22px 26px;border-radius:14px}
  .login-head{margin-bottom:24px}.login-head h1{font-size:1.5rem}.login-logo{width:88px;height:88px}
}
@media (max-height:620px){.login-box{padding-top:24px;padding-bottom:22px}.login-head{margin-bottom:18px}.login-logo{width:72px;height:72px;margin-bottom:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<main class="login-main">
  <section class="login-box" aria-labelledby="h-login">
    <div class="login-head">
      <img class="login-logo" src="/assets/logo.png" alt="โลโก้มหาวิทยาลัยหาดใหญ่" width="104" height="104">
      <h1 id="h-login">เข้าสู่ระบบเจ้าหน้าที่</h1>
      <p>ระบบยืม-คืนบอร์ดเกม</p>
    </div>
    <form id="lf" class="lf" novalidate>
      <div class="lf-field"><label for="lu">ชื่อผู้ใช้</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="lf-field"><label for="lp">รหัสผ่าน</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <p class="lf-err" id="le" role="alert"></p>
      <button class="lf-btn" type="submit" id="lb">เข้าสู่ระบบ</button>
    </form>
    <a class="login-back" href="/">← กลับหน้าผู้ใช้</a>
  </section>
</main>
<script src="/common.js"></script><script src="/login.js"></script>
</body></html>
